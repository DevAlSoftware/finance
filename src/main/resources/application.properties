spring.application.name=devalFinance

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/devalfinance
spring.datasource.username=postgres
spring.datasource.password=1036664461
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# JWT Configuration
jwt.secret=dev-secret-key-change-in-production-use-strong-random-key
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Server Configuration
server.port=8888
server.servlet.context-path=/api

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.show-actuator=false
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
springdoc.packages-to-scan=com.devalFinance.presentation.controller
springdoc.paths-to-match=/**
springdoc.packages-to-exclude=com.devalFinance.presentation.exception

# Logging Configuration
logging.level.com.devalFinance=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springdoc=DEBUG
logging.level.io.swagger=DEBUG
